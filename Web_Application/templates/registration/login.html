{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Log in" %} - {% trans "Factory Tracker" %}{% endblock %}

{% block content %}
  <h1>{% trans "Log in" %}</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button">{% trans "Log in" %}</button>
  </form>
{% endblock %}
