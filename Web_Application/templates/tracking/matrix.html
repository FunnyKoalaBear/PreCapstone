{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Progress matrix" %} - {% trans "Factory Tracker" %}{% endblock %}

{% block content %}
  <h1>{% trans "Progress matrix" %}</h1>

  <form method="get" class="filters">
    <div>
      <label for="status">{% trans "Status" %}</label>
      <select id="status" name="status">
        <option value="">{% trans "All" %}</option>
        {% for code, label in status_choices %}<option value="{{ code }}"{% if code == status %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label for="customer">{% trans "Customer" %}</label>
      <select id="customer" name="customer">
        <option value="">{% trans "All" %}</option>
        {% for c in customers %}<option value="{{ c.pk }}"{% if c.pk == customer %} selected{% endif %}>{{ c.name }}</option>{% endfor %}
      </select>
    </div>
    <div><label for="due_from">{% trans "Due from" %}</label><input type="date" id="due_from" name="due_from" value="{{ due_from }}"></div>
    <div><label for="due_to">{% trans "Due to" %}</label><input type="date" id="due_to" name="due_to" value="{{ due_to }}"></div>
    <label class="check"><input type="checkbox" name="late" value="1"{% if late %} checked{% endif %}> {% trans "Overdue only" %}</label>
    <label class="check"><input type="checkbox" name="current" value="1"{% if from_current %} checked{% endif %}> {% trans "Start at current step" %}</label>
    <button type="submit" class="button">{% trans "Apply" %}</button>
  </form>

  {% include "tracking/_matrix.html" %}
  {% if matrix.more %}<p><a class="button-secondary" href="{{ more_url }}">{% trans "Show more" %}</a></p>{% endif %}
{% endblock %}
