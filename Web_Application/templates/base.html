{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% trans "Factory Tracker" %}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <header class="site-header">
    <span class="brand">{% trans "Factory Tracker" %}</span>
    <nav class="site-nav">
      <a href="{% url 'home' %}">{% trans "Home" %}</a>
    </nav>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">{% trans "Factory Tracker" %}</footer>
</body>
</html>
