{% load i18n static %}
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="card">{% include "includes/form_fields.html" %}</div>

    {{ formset.management_form }}
    {{ formset.non_form_errors }}
    {% for f in formset %}
      {% include "orders/_item_card.html" with n=forloop.counter %}
    {% endfor %}

    <template id="item-template">
      {% include "orders/_item_card.html" with f=formset.empty_form n="" %}
    </template>

    <div class="form-actions form-actions-sticky">
      <button type="submit" class="button">{% if order %}{% trans "Save changes" %}{% else %}{% trans "Create order" %}{% endif %}</button>
      <a class="button-secondary" href="{% if order %}{% url 'order_detail' order.job_number %}{% else %}{% url 'order_list' %}{% endif %}">{% trans "Cancel" %}</a>
      <button type="button" id="add-item" class="button-secondary">{% trans "Add another item" %}</button>
    </div>
  </form>

  <script src="{% static 'js/formset.js' %}"></script>
