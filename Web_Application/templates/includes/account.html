{% load i18n %}
{% if request.user.is_authenticated %}
<form action="{% url 'logout' %}" method="post" class="account">
  {% csrf_token %}
  <span>{{ request.user.get_username }}</span>
  <a href="{% url 'password_change' %}">{% trans "Change password" %}</a>
  <button type="submit">{% trans "Log out" %}</button>
</form>
{% else %}
<a class="account" href="{% url 'login' %}">{% trans "Log in" %}</a>
{% endif %}
